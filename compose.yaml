
services:

  app:
    build:
      context: .
      target: prod
    restart: unless-stopped
    volumes:
      - ./var:/var/www/html/var
      - ./config/jwt:/var/www/html/config/jwt:ro
      - uploads_data:/var/www/html/public/uploads
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET}
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      MERCURE_URL: http://mercure/.well-known/mercure
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - uploads_data:/var/www/html/public/uploads:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sailingloc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sailingloc_password}
      POSTGRES_USER: ${POSTGRES_USER:-sailingloc}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-sailingloc}", "-U", "${POSTGRES_USER:-sailingloc}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw


###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    env_file:
      # Absent en CI (fichier local non versionné) : ne doit pas faire échouer `docker compose up`.
      - path: .env.local
        required: false
    environment:
      # HTTPS is terminated upstream (host Caddy + nginx), so serve plain HTTP here
      SERVER_NAME: ':80'
      # MERCURE_PUBLISHER_JWT_KEY / MERCURE_SUBSCRIBER_JWT_KEY come from .env.local
      # and must match the app's MERCURE_JWT_SECRET (same signing secret on both sides)
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8000
    # Comment the following line to disable the development mode
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
  database_data:
  uploads_data:

###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
